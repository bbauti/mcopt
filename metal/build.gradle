plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = '0.3.0-alpha.2'

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	// Our mesher's FRAPI path (mcopt.metal.own.OwnFrapi, loaded only when Fabric API's renderer API is): compile only, never bundled.
	compileOnly "net.fabricmc.fabric-api:fabric-renderer-api-v1:17.0.15+79385d0b5d"
	compileOnly "net.fabricmc.fabric-api:fabric-api-base:2.0.6+fcdff87f5d"
	// Far terrain from servers running mcopt-server (mcopt.metal.lod.LodRemote, loaded only when Fabric API's networking is): compile only.
	compileOnly "net.fabricmc.fabric-api:fabric-networking-api-v1:6.3.8+fcdff87f5d"
}

def nativeOut = layout.buildDirectory.dir('natives/natives')
// Zstandard's decompressor (mczstd.c, for the far terrain's imports): its pinned release, fetched once into build/
def zstd = layout.buildDirectory.dir('zstd').get().asFile

tasks.register('fetchZstd', Exec) {
	outputs.dir zstd
	doFirst { zstd.mkdirs() }
	commandLine 'sh', '-c', 'cd "$0" && curl -sSfL -o z.tar.gz https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz && echo ' +
		'"8c29e06cf42aacc1eafc4077ae2ec6c6fcb96a626157e0593d5e82a34fd403c1  z.tar.gz" | shasum -a 256 -c --status && tar xzf z.tar.gz', zstd
}

tasks.register('compileNative', Exec) {
	dependsOn 'fetchZstd'
	def sources = ['mcmetal.m', 'mclod.m', 'lodseam.m', 'lodmesh.c', 'lodnoise.c', 'rec.m', 'mcown.m', 'mccap.m', 'mczstd.c'].collect { file("src/main/native/$it") }
	def output = nativeOut.get().file('libmcmetal.dylib').asFile
	inputs.files sources, file('src/main/native/mcmetal.h'), file('src/main/native/lodmesh.h')
	outputs.file output
	doFirst { output.parentFile.mkdirs() }
	commandLine(['clang', '-fno-objc-arc', '-O2', '-Wall', '-arch', 'arm64', '-mmacosx-version-min=15.0', '-dynamiclib', '-install_name', '@rpath/libmcmetal.dylib',
		'-I', "$zstd/zstd-1.5.6/lib", '-I', "$zstd/zstd-1.5.6/build/single_file_libs",
		'-framework', 'CoreGraphics', '-framework', 'CoreVideo', '-framework', 'Foundation', '-framework', 'Metal', '-framework', 'QuartzCore', '-o', output] + sources)
}

processResources {
	dependsOn 'compileNative'
	from(layout.buildDirectory.dir('natives'))
	inputs.property 'version', version
	filesMatching('fabric.mod.json') { expand 'version': version }
}

// Double-clicking the jar (java -jar) explains that it's a Fabric mod and how to install it.
jar {
	manifest { attributes 'Main-Class': 'mcopt.metal.InstallHelp', 'Implementation-Version': version }
	// Apache-2.0 asks for LICENSE and NOTICE in every copy.
	from(rootProject.file('LICENSE'))
	from(rootProject.file('NOTICE'))
	// the native library carries Zstandard's decompressor (BSD: its notice goes with the binary)
	from("$zstd/zstd-1.5.6/LICENSE") { rename { 'LICENSE-zstd' } }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// the far terrain's Vector API noise control (LodNoiseVector, opt-in -Dmcopt.lod.nativeNoise=vector): loaded only when the game runs with
	// --add-modules jdk.incubator.vector
	if (it.name == 'compileJava') it.options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}
